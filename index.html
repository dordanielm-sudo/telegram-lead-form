<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>דבש הברכה - אור הרשב"י</title>

<meta property="og:title" content="דבש הברכה">
<meta property="og:description" content="לקבלת דבש הברכה המקודש ישירות לביתכם - השאירו פרטים">
<meta property="og:image" content="logo.png">

<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* צבעי המותג, ולא ערכת הנושא של טלגרם: העמוד הזה נשלח גם בוואטסאפ
     ובמודעות, וצריך להיראות אותו דבר בכל מקום */
  :root {
    --bg:     #fdf8ef;
    --card:   #ffffff;
    --text:   #3b2412;
    --muted:  #8a6f57;
    --gold:   #c9922f;
    --gold-d: #a8761d;
    --line:   #ecdcc4;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 28px 20px 40px;
    font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 420px; margin: 0 auto; }

  .logo { display: block; width: 132px; height: auto; margin: 0 auto 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: 30px; font-weight: 800;
    text-align: center;
    color: var(--gold-d);
  }
  p.lead {
    margin: 0 auto 26px;
    max-width: 340px;
    font-size: 17px; line-height: 1.6;
    text-align: center;
    color: var(--text);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 6px 24px rgba(59, 36, 18, .07);
  }

  label { display: block; margin-bottom: 6px; font-size: 15px; font-weight: 500; }
  input {
    width: 100%; padding: 13px 14px; margin-bottom: 16px;
    font-family: inherit; font-size: 16px;
    color: var(--text); background: #fffdf9;
    border: 1px solid var(--line); border-radius: 12px;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: -1px; background: #fff; }
  input[type="tel"] { direction: ltr; text-align: right; }

  button {
    width: 100%; padding: 15px;
    font-family: inherit; font-size: 17px; font-weight: 700;
    color: #fff; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-d) 100%);
    box-shadow: 0 4px 14px rgba(168, 118, 29, .3);
  }
  button[disabled] { opacity: .6; box-shadow: none; cursor: default; }

  .error {
    margin: 0 0 16px; padding: 11px 13px;
    border-radius: 10px; font-size: 15px;
    background: #fdeaea; color: #b42318;
  }
  .hidden { display: none; }

  #done { text-align: center; }
  #done h1 { margin-bottom: 12px; }
  #done p { margin: 0 auto; max-width: 320px; font-size: 17px; line-height: 1.6; color: var(--muted); }
  .honey { font-size: 44px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- logo.png יושב בשורש ה-repo. עד שהוא מועלה, מסתירים את התמונה במקום
       להציג אייקון של קובץ שבור -->
  <img class="logo" id="logo" src="logo.png" alt='ישיבת אור הרשב"י'
       onerror="this.style.display='none'">

  <form id="lead-form" novalidate>
    <h1>דבש הברכה 🍯</h1>
    <p class="lead">לקבלת דבש הברכה המקודש ישירות לביתכם השאירו פרטים</p>

    <div class="card">
      <p id="error" class="error hidden"></p>

      <label for="name">שם מלא</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="phone">מספר טלפון</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>

      <button type="submit" id="submit">שליחת פרטים</button>
    </div>
  </form>

  <div id="done" class="hidden">
    <span class="honey">🍯</span>
    <h1>תודה!</h1>
    <p>הפרטים התקבלו ודבש הברכה בדרך אליכם.<br>ניצור איתכם קשר בהקדם.</p>
  </div>

</div>

<script>
  // הכתובת של הוובהוק ב-Make. מקבל שני שדות בלבד: name, phone.
  var WEBHOOK_URL = "https://hook.eu1.make.com/zzrivke4mrh0oki1axk5gluoywtw3emq";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    // טלגרם כבר יודע איך קוראים לו - ממלאים מראש, וניתן לתקן
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      var full = [u.first_name, u.last_name].filter(Boolean).join(" ").trim();
      if (full) document.getElementById("name").value = full;
    }
  }

  var form = document.getElementById("lead-form");
  var errorBox = document.getElementById("error");
  var button = document.getElementById("submit");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    errorBox.classList.add("hidden");

    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var digits = phone.replace(/\D/g, "");

    if (name.length < 2) return showError("יש למלא שם מלא");
    if (digits.length < 9 || digits.length > 15) return showError("מספר הטלפון אינו תקין");

    button.disabled = true;
    button.textContent = "שולח...";

    // form-encoded ולא JSON בכוונה: זו "בקשה פשוטה" בעיני הדפדפן, ולכן אין
    // preflight של CORS שהוובהוק צריך לענות עליו. no-cors מבטיח שהיעדר
    // כותרות CORS בתשובה לא יציג שגיאה על ליד שכן נמסר - במחיר זה שאי אפשר
    // לקרוא את קוד התשובה.
    var body = new URLSearchParams({
      name: name,
      phone: phone.charAt(0) === "+" ? "+" + digits : digits
    });

    fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: body })
      .then(function () {
        form.classList.add("hidden");
        document.getElementById("done").classList.remove("hidden");
        window.scrollTo(0, 0);
        // בתוך טלגרם סוגרים את החלון, אבל רק אחרי שהספיקו לקרוא את התודה.
        // בדפדפן רגיל אין מה לסגור - מסך התודה פשוט נשאר.
        if (tg) setTimeout(function () { tg.close(); }, 3000);
      })
      .catch(function () {
        button.disabled = false;
        button.textContent = "שליחת פרטים";
        showError("אירעה שגיאה בשליחת הפרטים. נסו שוב בעוד רגע.");
      });
  });
</script>
</body>
</html>
