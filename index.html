<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>השארת פרטים</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:   var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --btn:  var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.sub { margin: 0 0 24px; font-size: 14px; color: var(--hint); }
  label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%; padding: 12px; margin-bottom: 16px; font-size: 16px;
    border: 1px solid rgba(128,128,128,.35); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  input:focus { outline: 2px solid var(--btn); outline-offset: -1px; }
  input[type="tel"] { direction: ltr; text-align: right; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--btn); color: var(--btn-text);
  }
  button[disabled] { opacity: .6; cursor: default; }
  .error {
    margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    background: rgba(220,38,38,.12); color: #dc2626;
  }
  .hidden { display: none; }
  #done { text-align: center; padding-top: 40px; }
  #done h1 { font-size: 22px; }
</style>
</head>
<body>

<form id="lead-form" novalidate>
  <h1>נשמח להכיר</h1>
  <p class="sub">השאירו פרטים ונחזור אליכם בהקדם.</p>

  <p id="error" class="error hidden"></p>

  <label for="name">שם מלא</label>
  <input id="name" name="name" type="text" autocomplete="name" required>

  <label for="phone">מספר טלפון</label>
  <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>

  <button type="submit" id="submit">שליחת פרטים</button>
</form>

<div id="done" class="hidden">
  <h1>תודה!</h1>
  <p class="sub">הפרטים התקבלו, נחזור אליכם בהקדם.</p>
</div>

<script>
  // הכתובת של הוובהוק ב-Make. מקבל שני שדות בלבד: name, phone.
  var WEBHOOK_URL = "https://hook.eu1.make.com/zzrivke4mrh0oki1axk5gluoywtw3emq";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    // טלגרם כבר יודע איך קוראים לו - ממלאים מראש, וניתן לתקן
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      var full = [u.first_name, u.last_name].filter(Boolean).join(" ").trim();
      if (full) document.getElementById("name").value = full;
    }
  }

  var form = document.getElementById("lead-form");
  var errorBox = document.getElementById("error");
  var button = document.getElementById("submit");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    errorBox.classList.add("hidden");

    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var digits = phone.replace(/\D/g, "");

    if (name.length < 2) return showError("יש למלא שם מלא");
    if (digits.length < 9 || digits.length > 15) return showError("מספר הטלפון אינו תקין");

    button.disabled = true;
    button.textContent = "שולח...";

    // form-encoded ולא JSON בכוונה: זו "בקשה פשוטה" בעיני הדפדפן, ולכן אין
    // preflight של CORS שהוובהוק צריך לענות עליו. no-cors מבטיח שהיעדר
    // כותרות CORS בתשובה לא יציג שגיאה על ליד שכן נמסר - במחיר זה שאי אפשר
    // לקרוא את קוד התשובה.
    var body = new URLSearchParams({
      name: name,
      phone: phone.charAt(0) === "+" ? "+" + digits : digits
    });

    fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: body })
      .then(function () {
        form.classList.add("hidden");
        document.getElementById("done").classList.remove("hidden");
        // סוגרים את החלון רק אחרי שראו את האישור
        if (tg) setTimeout(function () { tg.close(); }, 1500);
      })
      .catch(function () {
        button.disabled = false;
        button.textContent = "שליחת פרטים";
        showError("אירעה שגיאה בשליחת הפרטים. נסו שוב בעוד רגע.");
      });
  });
</script>
</body>
</html>
